name: Format secure audio delivery branch
on:
  push:
    branches:
      - work/secure-audio-delivery
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/secure-audio-delivery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format all changed source and configuration files
        run: |
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\\.(ts|tsx|js|jsx|json|md|css|yml|yaml|jsonc)$' || true)
          if (( ${#files[@]} > 0 )); then
            npx prettier --write "${files[@]}"
          fi
      - name: Commit formatted files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: format secure audio delivery changes"
            git push origin work/secure-audio-delivery
          else
            echo "No formatting changes required."
          fi
