name: Format secure audio delivery branch
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - work/secure-audio-delivery
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/secure-audio-delivery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format source and configuration files
        run: |
          npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,md,css}" "wrangler.jsonc" ".github/workflows/*.yml"
      - name: Run lint, tests and production build
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit formatted files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: format secure audio delivery changes"
            git push origin work/secure-audio-delivery
          else
            echo "No formatting changes required."
          fi
