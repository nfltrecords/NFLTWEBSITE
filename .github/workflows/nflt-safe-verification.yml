name: NFLT safe verification
on:
  push:
    branches:
      - work/operations-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm for Node 22 compatibility
        run: npm install --global npm@11.21.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit catalogue and preview assets
        run: npm run audit:assets
      - name: Run tests
        run: npm test
      - name: Build (no deployment)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Checkout legacy Cloudflare archive branch
        uses: actions/checkout@v4
        with:
          ref: work/operations-readiness
          path: legacy-archives
      - name: Remove 30-second preview MP3s from legacy deployment archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import pathlib, re, zipfile
          root = pathlib.Path("legacy-archives")
          output = pathlib.Path("cleaned-archives")
          output.mkdir(exist_ok=True)
          names = ["NFLT_CLOUDFLARE_UPLOAD_CORRIGE.zip", "NFLT_PAGES_DEPLOY.zip", "NFLT_SITE_CLOUDFLARE_UPLOAD.zip"]
          preview = re.compile(r"_PREVIEW_30S\\.mp3$", re.I)
          for name in names:
              source = root / name
              target = output / name
              removed = []
              with zipfile.ZipFile(source) as zin:
                  with zipfile.ZipFile(target, "w") as zout:
                      zout.comment = zin.comment
                      for info in zin.infolist():
                          if not info.is_dir() and preview.search(info.filename):
                              removed.append(info.filename)
                              continue
                          zout.writestr(info, zin.read(info.filename))
              if len(removed) != 37:
                  raise SystemExit(f"Expected 37 preview MP3s in {name}, found {len(removed)}")
              with zipfile.ZipFile(target) as check:
                  leftovers = [i.filename for i in check.infolist() if preview.search(i.filename)]
                  if leftovers:
                      raise SystemExit(f"Preview files remain in {name}: {leftovers}")
                  print(f"CLEANED {name}: removed={len(removed)} remaining_entries={len(check.infolist())} new_bytes={target.stat().st_size}")
          PY
          git clone --depth 1 --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/nfltrecords/NFLTWEBSITE.git" branch-cleanup
          cd branch-cleanup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in work/audio-preview-audit work/catalogue-previews-audit work/footer-logo-original work/nflt-kv-audio-delivery-rebased work/operations-readiness work/secure-audio-delivery work/streaming-hub; do
            git fetch --depth 1 origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
            cp ../cleaned-archives/*.zip .
            git add -- NFLT_CLOUDFLARE_UPLOAD_CORRIGE.zip NFLT_PAGES_DEPLOY.zip NFLT_SITE_CLOUDFLARE_UPLOAD.zip
            git commit -m "Remove 30-second preview MP3s from legacy deployment archives"
            git push origin HEAD:"$branch"
          done
