name: NFLT safe verification
on:
  push:
    branches:
      - work/operations-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Checkout legacy Cloudflare archive branch
        uses: actions/checkout@v4
        with:
          ref: work/operations-readiness
          path: legacy-archives
      - name: Inspect legacy deployment ZIP archives
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, shutil, subprocess, tempfile, zipfile
          root = pathlib.Path("legacy-archives")
          names = ["NFLT_CLOUDFLARE_UPLOAD_CORRIGE.zip", "NFLT_PAGES_DEPLOY.zip", "NFLT_SITE_CLOUDFLARE_UPLOAD.zip"]
          audio = re.compile(r"\.(wav|m4a|mp3|flac|aif|aiff|aac|ogg|oga|opus|wma|alac|caf|mp4|m4b|amr|mid|midi)$", re.I)
          nested_pattern = re.compile(r"\.(zip|rar|7z|tar|gz|tgz|xz|bz2)$", re.I)
          ffprobe = shutil.which("ffprobe")
          def inspect_zip(z, label, depth=0):
              entries = z.infolist()
              files = [e for e in entries if not e.is_dir()]
              audio_files = [e for e in files if audio.search(e.filename)]
              nested = [e for e in files if nested_pattern.search(e.filename)]
              print(f"ARCHIVE={label} entries={len(entries)} audio={len(audio_files)} nested={len(nested)}")
              for e in audio_files:
                  if ffprobe:
                      with z.open(e) as source, tempfile.NamedTemporaryFile(suffix=pathlib.Path(e.filename).suffix) as tmp:
                          shutil.copyfileobj(source, tmp)
                          tmp.flush()
                          probe = subprocess.run([ffprobe, "-v", "error", "-show_entries", "format=duration,format_name:format_tags=title,album", "-of", "json", tmp.name], capture_output=True, text=True)
                          try:
                              fmt = json.loads(probe.stdout or "{}").get("format", {})
                              print(f"AUDIO={label}!{e.filename} size={e.file_size} duration={fmt.get('duration','n/a')} format={fmt.get('format_name','n/a')}")
                          except Exception:
                              print(f"AUDIO={label}!{e.filename} size={e.file_size} probe_error={probe.stderr[:200]}")
                  else:
                      print(f"AUDIO={label}!{e.filename} size={e.file_size} duration=not-probed")
              for e in nested:
                  print(f"NESTED={label}!{e.filename} size={e.file_size}")
                  if depth < 2 and e.filename.lower().endswith(".zip"):
                      with z.open(e) as source, tempfile.NamedTemporaryFile(suffix=".zip") as tmp:
                          shutil.copyfileobj(source, tmp)
                          tmp.flush()
                          with zipfile.ZipFile(tmp.name) as child:
                              inspect_zip(child, f"{label}!{e.filename}", depth + 1)
          for name in names:
              path = root / name
              print(f"\nTOP_LEVEL={name} exists={path.exists()} size={path.stat().st_size if path.exists() else 0}")
              if not path.exists():
                  continue
              with zipfile.ZipFile(path) as z:
                  entries = z.infolist()
                  print(f"HAS_AUDIO_ORIGINALS={any(e.filename.rstrip('/').endswith('audio-originals') for e in entries)}")
                  print(f"HAS_AUDIO_INVENTORY={any(e.filename.endswith('audio-inventory.csv') for e in entries)}")
                  inspect_zip(z, name)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm for Node 22 compatibility
        run: npm install --global npm@11.21.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit catalogue and preview assets
        run: npm run audit:assets
      - name: Run tests
        run: npm test
      - name: Build (no deployment)
        run: npm run build
      - name: Lint
        run: npm run lint
