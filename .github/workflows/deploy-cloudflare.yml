name: Deploy NFLT website to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nflt-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm
        run: npm install --global npm@11.21.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build and deploy to Cloudflare Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc85caec065ff9d86b601859aa0f00f3
