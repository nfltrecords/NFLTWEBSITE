name: NFLT automatic formatting repair
on:
  push:
    branches:
      - work/operations-readiness
permissions:
  contents: write
jobs:
  prettier-fix:
    if: "!contains(github.event.head_commit.message, '[prettier-auto-fix]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/operations-readiness
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm for Node 22 compatibility
        run: npm install --global npm@11.21.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply Prettier formatting
        run: npx prettier --write .
      - name: Commit formatted files to work branch
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply Prettier formatting [prettier-auto-fix]"
          git push origin work/operations-readiness
