name: Prepare Cloudflare source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract full project into repository root
        run: |
          ARCHIVE="NFLT_RECORDS_POCHETTES_CORRIGEES_2.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Source archive not present; nothing to extract."
            exit 0
          fi
          unzip -o "$ARCHIVE" -d .
          rm "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract NFLT RECORDS full source for Cloudflare"
            git push
          fi
