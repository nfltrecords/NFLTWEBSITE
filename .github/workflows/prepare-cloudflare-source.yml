name: Prepare Cloudflare source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify source archive is present
        run: |
          ARCHIVE="NFLT_RECORDS_POCHETTES_CORRIGEES_2.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Source archive not present; nothing to prepare."
            exit 1
          fi
          echo "Source archive found. Automatic extraction and push are intentionally disabled."
