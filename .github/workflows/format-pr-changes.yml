name: Format PR changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed source files
        run: |
          npx prettier --write \
            docs/MANUAL-PAYPAL-AUTOMATIC-WAV-DELIVERY.md \
            docs/SECURE-AUDIO-DELIVERY-SETUP.md \
            src/components/CommercePages.tsx \
            src/lib/delivery.server.ts \
            src/lib/manual-orders.functions.ts \
            src/lib/paypal.functions.ts \
            src/routes/api.download.ts \
            src/routes/api.paypal.ipn.ts \
            src/routes/api.paypal.webhook.ts \
            src/routes/commande.confirmation.tsx \
            src/routes/commande.paiement.tsx \
            src/routes/espace-commandes.tsx \
            src/routes/telechargement.tsx \
            src/test/cloudflare-workers.mock.ts \
            vitest.config.ts \
            wrangler.jsonc
      - name: Commit formatting changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs src vitest.config.ts wrangler.jsonc
            git commit -m "Format secure audio delivery changes"
            git push
          fi
