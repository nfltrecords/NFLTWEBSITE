name: Verify source
on:
  push:
    branches: [main, work/operations-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm to avoid Node 22 npm 10 peer-tree crash
        run: npm install --global npm@11.21.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build (no deployment)
        if: always() && !cancelled()
        run: npm run build
      - name: Generate Cloudflare binding types
        if: always() && !cancelled()
        run: npm run cf-typegen
      - name: Typecheck
        if: always() && !cancelled()
        run: npm run typecheck
